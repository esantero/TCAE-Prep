<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCAE Prep - Exámenes Oficiales</title>
    <!-- Fuente Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D9488',
                        'primary-dark': '#0F766E',
                        'primary-light': '#F0FDFA',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Nuevo Logo: Cruz Sanitaria y Texto (Actúa como Botón Inicio) -->
            <div class="flex items-center space-x-2 cursor-pointer group" onclick="requestGoHome()">
                <svg class="w-7 h-7 text-primary group-hover:scale-105 transition-transform" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 10.5h-5.5V5h-3v5.5H5v3h5.5V19h3v-5.5H19v-3z" />
                </svg>
                <h1 class="font-extrabold text-2xl text-gray-900 tracking-tight pt-0.5">TCAE Prep</h1>
            </div>
            
            <div id="header-actions" class="flex items-center space-x-2">
                <!-- Botón de Errores dinámico -->
                <button onclick="openErrorsModal()" class="text-xs font-medium bg-amber-50 text-amber-700 px-3 py-1.5 rounded-lg border border-amber-200 flex items-center space-y-0 space-x-1 hover:bg-amber-100 transition">
                    <span>⚠️ Errores</span>
                    <span id="error-badge" class="bg-amber-600 text-white rounded-full px-1.5 py-0.2 text-[10px]">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal Dinámico -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 pb-24">

        <!-- VISTA 1: HOME / DASHBOARD -->
        <div id="view-home" class="space-y-6">

            <!-- Simulacro Rápido -->
            <div class="bg-gradient-to-r from-primary to-teal-700 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <div class="relative z-10">
                    <span class="bg-white/20 text-white text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Modo exprés</span>
                    <h2 class="text-2xl font-bold mt-2">Simulacro Rápido General</h2>
                    <p class="text-teal-100 text-sm mt-1 max-w-md">30 preguntas aleatorias de todas las asignaturas para poner a prueba tu nivel al instante.</p>

                    <div class="mt-4 flex flex-wrap items-center gap-3">
                        <button onclick="startQuickExam()" class="bg-white text-primary font-bold px-5 py-2.5 rounded-xl shadow hover:bg-teal-50 transition active:scale-95 text-sm">
                            Empezar Simulacro 🚀
                        </button>
                    </div>
                </div>
                <div class="absolute -right-6 -bottom-6 text-white/10 text-9xl font-bold select-none pointer-events-none">
                    TCAE
                </div>
            </div>

            <!-- Listado de Asignaturas Oficiales -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-900">Asignaturas Oficiales</h3>
                    <span class="text-xs text-gray-500 font-medium">Elige una para filtrar</span>
                </div>

                <div id="subjects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Inyectado por JS -->
                </div>
            </div>

        </div>

        <!-- VISTA 2: SELECCIÓN DE TEMAS -->
        <div id="view-topics" class="hidden space-y-6">
            <button onclick="goToHome()" class="text-sm font-medium text-primary flex items-center space-x-1 hover:underline">
                <span>← Volver a Asignaturas</span>
            </button>

            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                <h2 id="selected-subject-title" class="text-2xl font-bold text-gray-900"></h2>
                <p class="text-sm text-gray-500 mt-1">Selecciona los temas que deseas incluir en el examen o hazlo completo.</p>

                <div class="mt-6 space-y-3" id="topics-list-container">
                    <!-- Inyectado por JS -->
                </div>

                <!-- Opciones de examen (Número de preguntas) -->
                <div class="mt-8 pt-6 border-t border-gray-100">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Número de preguntas para este test:</label>
                    <div id="question-count-selector" class="flex space-x-2">
                        <button onclick="setQuestionCount(15)" class="count-btn px-4 py-2 rounded-xl border border-gray-200 text-sm font-medium text-gray-700 hover:border-primary transition">15</button>
                        <button onclick="setQuestionCount(30)" class
